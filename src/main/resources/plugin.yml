name: Politik
description: Nation-based land plugin, with emphasis on fighting and factory elements
author: gooseapple5
version: '${project.version}'
website: https://github.com/specklogan/Politiks
main: goose.politik.Politik
folia-supported: true
api-version: 1.20
commands:
  addmoney:
    description: Adds money to player, negative numbers subtract money
    aliases: addm
    permission: politik.command.addmoney
    usage: /addmoney {player} {amount}
  setmoney:
    description: Sets the money of a player
    aliases: setm
    permission: politik.command.setmoney
    usage: /setmoney {player} {amount}
  balance:
    description: Returns the value of your balance {$}
    aliases: bal
    usage: /<command> [player]
  jobset:
    desription: Set which job you want to be
    aliases: js
    usage: /<command> [job]
  claimtool:
    description: Gives the player the tool to claim land
    aliases: ct
    usage: /<command>
  serverclaimtool:
    description: Used for server claims
    aliases: sct
    usage: /<command>
    permission: politik.command.serverclaimtool
  nation:
    description: Returns list of valid nation commands
    aliases: [na, nt]
    usage: /<command> [help, list, create]
  town:
    description: Returns list of valid town commands
    aliases: t
    usage: /<command> [help,list,create,invite]
  list:
    description: List all players
    permission: politik.command.list
  land:
    description: Returns a list of valid land commands
    aliases: l
    usage: /<command> [list, position]
